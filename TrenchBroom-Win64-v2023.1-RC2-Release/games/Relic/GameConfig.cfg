{
    "version": 5,
    "name": "Relic",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Valve" }
    ],
    "filesystem": {
        "searchpath": "Assets",
        "packageformat": { "extension": "zip", "format": "zip" }
    },
    "textures": {
        "package": { "type": "directory", "root": "Textures" },
        "format": { "extensions": [ "png", "jpg", "tga" ], "format": "image" },
        "palette": "gfx/palette.lmp",
        "attribute": "texture",
        "excludes": [ "*_n", "*_norm", "*_normal", "*_s", "*_spec", "*_r", "*_rough" ]
    },
    "entities": {
        "definitions": [ "Relic.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger_once"
            }
        ],
        "brushface": [
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "texture",
                "pattern": "clip"
            },
            {
                "name": "Skip",
                "match": "texture",
                "pattern": "skip"
            }
        ]
    },
    "softMapBounds": "-4096 -4096 -4096 4096 4096 4096",
    "compilationTools": []
}
