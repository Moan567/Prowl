// Relic TrenchBroom Compilation Profiles
// Relic loads .map files directly - no BSP compilation step is required.
// These profiles document the content workflow for TrenchBroom.

[profile "Play in Relic"]
task_copy_map = "Copy ${MAP_BASE_NAME}.map to Assets/Maps/"
task_run = "Run Relic.Runtime (loads Assets/Maps/${MAP_BASE_NAME}.map)"

[profile "Export Map"]
task_copy_map = "Copy ${MAP_BASE_NAME}.map to Assets/Maps/"

[notes]
format = "Valve 220 (Valve map format, Z-Up)"
export_dir = "Assets/Maps"
no_compilation_required = true
