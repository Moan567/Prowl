// Relic TrenchBroom Face Attributes
// Default surface properties for Valve 220 faces.
// Scale matches Relic world units: 1 texture pixel = 1 unit at scale 1.

[defaults]
scale_x = 1.0
scale_y = 1.0
shift_x = 0
shift_y = 0
rotation = 0.0

// Material groups exposed in the texture browser under "Relic".
// Each group maps to Assets/Materials/<name>.mat which provides:
//   diffuse, normal, specular, roughness, tint
[materials]
brick
metal
concrete
